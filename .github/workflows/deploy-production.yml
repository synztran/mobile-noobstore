name: Deploy production (web)

# Production deployment runs automatically on push/merge to `prd` (or manually via workflow_dispatch).
# Production deploys to Cloudflare Workers after verification (type-check + unit tests).
on:
  push:
    branches: [prd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

jobs:
  verify:
    name: Verify latest prd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the prd branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/prd" ]; then
            echo "::error::Dispatch this workflow from the prd branch (got $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: prd
          fetch-depth: 0
      - name: Require the current prd HEAD
        run: |
          git fetch --depth=1 origin prd
          echo "checked out: $(git rev-parse HEAD)"
          echo "origin/prd:  $(git rev-parse origin/prd)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/prd)" ]; then
            echo "::error::HEAD is not the newest prd commit. Re-run after fetching."
            exit 1
          fi
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version-file: .nvmrc
      - name: Turbo cache
        uses: rharkor/caching-for-turbo@v1.5
      - name: Dependencies cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-yarn-
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type-check web
        run: yarn workspace @noobstore/web type-check
      - name: Unit tests web
        run: yarn test:unit

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers are configured on this environment, not in this file.
    environment:
      name: production
      url: https://www.noobstore.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prd
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: yarn
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build production Worker
        run: yarn workspace @noobstore/web exec opennextjs-cloudflare build
      - name: Deploy production Worker
        run: yarn workspace @noobstore/web exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
