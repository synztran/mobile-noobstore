name: Deploy production (web)

# Production deployment runs automatically on push/merge to `prd` (or manually via workflow_dispatch).
# Production deploys to Cloudflare Workers after security and Worker-build checks.
on:
  push:
    branches: [prd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

jobs:
  check:
    name: Security and Cloudflare checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the prd branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/prd" ]; then
            echo "::error::Dispatch this workflow from the prd branch (got $GITHUB_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: prd
          fetch-depth: 0
      - name: Require the current prd HEAD
        run: |
          git fetch --depth=1 origin prd
          echo "checked out: $(git rev-parse HEAD)"
          echo "origin/prd:  $(git rev-parse origin/prd)"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/prd)" ]; then
            echo "::error::HEAD is not the newest prd commit. Re-run after fetching."
            exit 1
          fi
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version-file: .nvmrc
      - name: Dependencies cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-yarn-
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Aikido dependency security scan
        uses: AikidoSec/github-actions-workflow@v1
        with:
          token: ${{ secrets.AIKIDO_API_KEY }}
          fail-on-dependency-scan: true
          fail-on-timeout: false
      - name: Build production Worker (Cloudflare check)
        run: yarn workspace @noobstore/web exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_COOKIE_DOMAIN: ${{ vars.NEXT_PUBLIC_COOKIE_DOMAIN }}
          NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_BETTERSTACK_RUM: ${{ vars.NEXT_PUBLIC_BETTERSTACK_RUM }}
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_STATUS_PAGE_URL: ${{ vars.NEXT_PUBLIC_STATUS_PAGE_URL }}
          NEXT_PUBLIC_TRACKING_ENABLED: ${{ vars.NEXT_PUBLIC_TRACKING_ENABLED }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_REVIEW_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_REVIEW_URL }}

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers are configured on this environment, not in this file.
    environment:
      name: production
      url: https://www.noobstore.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prd
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build production Worker
        run: yarn workspace @noobstore/web exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_COOKIE_DOMAIN: ${{ vars.NEXT_PUBLIC_COOKIE_DOMAIN }}
          NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_BETTERSTACK_RUM: ${{ vars.NEXT_PUBLIC_BETTERSTACK_RUM }}
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_STATUS_PAGE_URL: ${{ vars.NEXT_PUBLIC_STATUS_PAGE_URL }}
          NEXT_PUBLIC_TRACKING_ENABLED: ${{ vars.NEXT_PUBLIC_TRACKING_ENABLED }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_REVIEW_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_REVIEW_URL }}
      - name: Deploy production Worker
        run: yarn workspace @noobstore/web exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
