name: Deploy Cloudflare staging (web)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-staging-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Enable Yarn 4
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and deploy staging Worker
        run: yarn workspace @noobstore/web deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
