name: CI

on:
  push:
    branches: [prd]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version-file: .nvmrc
      # Restore/persist the Turborepo remote-cache local mirror between runs
      - name: Turbo cache
        uses: rharkor/caching-for-turbo@v1.5
      # Cache installed dependencies keyed by lockfile so install is instant
      # when nothing changed
      - name: Dependencies cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-yarn-
      - name: Enable corepack (yarn 4)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type-check web
        run: yarn workspace @noobstore/web type-check
      - name: Unit tests web
        run: yarn test:unit
      - name: Guard RLS + RPC grants (when migration history is present)
        run: |
          migration_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$migration_count" -ge 100 ]; then
            yarn check:rls
          else
            echo "::warning::RLS replay skipped: only $migration_count migration files are committed; full schema history is maintained outside this repo."
          fi
